# ============================================================
# URBAN SERVICES — SPRING BOOT APPLICATION CONFIGURATION
# Active profile is set via: spring.profiles.active (env var)
# Default profile: local
# ============================================================

spring:
  main:
    allow-bean-definition-overriding: true

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/urban_services_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: UrbanServicesHikariPool
      minimum-idle: 1
      maximum-pool-size: 10
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
      auto-commit: true

  application:
    name: core-service

  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 25MB

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # ── Jackson (JSON) ──────────────────────────────────────────
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: Asia/Kolkata

  # ── JPA / Hibernate ─────────────────────────────────────────
  jpa:
    open-in-view: false                      # prevents lazy-loading anti-pattern
    hibernate:
      ddl-auto: validate                     # Flyway owns DDL; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        generate_statistics: false

  # ── Flyway ──────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false
    out-of-order: true
    encoding: UTF-8

  # ── Redis (Lettuce) ─────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 10
          min-idle: 5
          max-wait: 1000ms

# ── Server ────────────────────────────────────────────────────
server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 2048
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# ── Actuator ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: Urban Services Backend
    version: '@project.version@'
    java-version: '@java.version@'

# ── AWS ───────────────────────────────────────────────────────
aws:
  region: ${AWS_REGION:ap-south-1}
  s3:
    bucket-name: ${AWS_S3_BUCKET:urban-services-dev}
    presigned-url-expiry-minutes: ${AWS_S3_PRESIGNED_EXPIRY:15}
    cloudfront-domain: ${AWS_CLOUDFRONT_DOMAIN:}
  sqs:
    notification-queue-url: ${AWS_SQS_NOTIFICATION_QUEUE:}
    email-queue-url: ${AWS_SQS_EMAIL_QUEUE:}

# ── Application ───────────────────────────────────────────────
app:
  api:
    version: v1
    prefix: /api/v1
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  pagination:
    default-page-size: 20
    max-page-size: 100
