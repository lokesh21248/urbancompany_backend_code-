server:
  port: 8080

spring:
  application:
    name: api-gateway
  codec:
    max-in-memory-size: 25MB
  cloud:
    gateway:
      routes:
        - id: catalog-service
          uri: lb://catalog-service
          predicates:
            - Path=/api/v1/categories/**,/api/v1/subcategories/**,/api/v1/services/**,/api/v1/catalog/**
        - id: core-service
          uri: lb://core-service
          predicates:
            - Path=/api/v1/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
